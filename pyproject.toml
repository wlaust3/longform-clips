[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "longform-clips"
version = "0.0.1"
description = "Longform Clips: turn long-form video into vertical 9:16 short clips with burned-in captions (pre-alpha)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "William Aust" }]
dependencies = [
    "typer>=0.12",
    "numpy>=1.26",
    "yt-dlp>=2024.8.6",
]

[project.optional-dependencies]
# Heavy ML dependencies are an extra so CI and unit tests never download models/torch.
ml = [
    "faster-whisper>=1.0",
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
longform-clips = "longform_clips.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/longform_clips"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: end-to-end smoke test that needs ffmpeg (with libass) on PATH"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
